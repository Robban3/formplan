apply plugin: 'com.android.application'

android {
    namespace = "app.formplan.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.formplan.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Google Play avvisar en uppladdning vars versionCode redan använts, och
        // Capacitors mall sätter alltid 1 — andra uppladdningen hade alltså
        // failat. I CI kommer numret från Codemagics räknare; lokalt räcker 1,
        // eftersom ett lokalt bygge aldrig laddas upp.
        //
        // Samma problem och samma lösning som CFBundleVersion på iOS-sidan, se
        // codemagic.yaml.
        versionCode (System.getenv('FORMPLAN_VERSION_CODE') ?: '1') as Integer
        versionName System.getenv('FORMPLAN_VERSION_NAME') ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Signeringsnyckeln för Google Play. Den läses ur miljövariabler (eller
    // gradle.properties i din användarkatalog) och får ALDRIG checkas in:
    // den som har keystoren kan publicera uppdateringar i ditt namn, och
    // tappar du bort den kan appen aldrig uppdateras igen.
    //
    // Skapa nyckeln en gång och lägg undan den på två säkra ställen. ALLT PÅ
    // EN RAD — `\` är radbrytning i bash, inte i Windows cmd, där den ger
    // "Otillåtet alternativ: \" och resten av raden körs som ett eget
    // kommando:
    //   keytool -genkeypair -v -keystore formplan-upload.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload
    //
    // Sätt sedan, t.ex. i %USERPROFILE%\.gradle\gradle.properties:
    //   formplan.keystore=C:/sokvag/till/formplan-upload.jks
    //   formplan.keystorePassword=...
    //   formplan.keyAlias=upload
    //   formplan.keyPassword=...
    //
    // Saknas uppgifterna byggs release osignerad i stället för att bygget
    // kraschar — så en utvecklare utan nyckel fortfarande kan bygga.
    def keystorePath = System.getenv('FORMPLAN_KEYSTORE') ?: project.findProperty('formplan.keystore')
    def hasSigningKey = keystorePath != null && !keystorePath.toString().isEmpty() && file(keystorePath).exists()

    signingConfigs {
        release {
            if (hasSigningKey) {
                storeFile file(keystorePath)
                storePassword System.getenv('FORMPLAN_KEYSTORE_PASSWORD') ?: project.findProperty('formplan.keystorePassword')
                keyAlias System.getenv('FORMPLAN_KEY_ALIAS') ?: project.findProperty('formplan.keyAlias')
                keyPassword System.getenv('FORMPLAN_KEY_PASSWORD') ?: project.findProperty('formplan.keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigningKey) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('FormPlan: ingen signeringsnyckel hittad — release byggs OSIGNERAD och kan inte laddas upp till Google Play. Se kommentaren i app/build.gradle.')
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
