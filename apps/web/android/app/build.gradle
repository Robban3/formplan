apply plugin: 'com.android.application'

// Google Play avvisar en uppladdning vars versionCode redan använts, och
// Capacitors mall sätter alltid 1 — andra uppladdningen hade alltså failat. I
// CI kommer numret från Codemagics räknare; lokalt räcker 1, eftersom ett
// lokalt bygge aldrig laddas upp.
//
// Samma problem och samma lösning som CFBundleVersion på iOS-sidan, se
// codemagic.yaml.
//
// Beräknas HÄR och inte inline i defaultConfig: `versionCode (uttryck) as
// Integer` är ett metodanrop i DSL:en, och `as Integer` binder då till
// anropets RESULTAT i stället för till argumentet — versionCode fick en
// String och bygget dog med "Value is null" på just den raden.
def formplanVersionCode = (System.getenv('FORMPLAN_VERSION_CODE') ?: '1').toInteger()
def formplanVersionName = System.getenv('FORMPLAN_VERSION_NAME') ?: '1.0'

android {
    namespace = "app.formplan.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.formplan.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode formplanVersionCode
        versionName formplanVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Signeringsnyckeln för Google Play. Den läses ur miljövariabler (eller
    // gradle.properties i din användarkatalog) och får ALDRIG checkas in:
    // den som har keystoren kan publicera uppdateringar i ditt namn, och
    // tappar du bort den kan appen aldrig uppdateras igen.
    //
    // Skapa nyckeln en gång och lägg undan den på två säkra ställen. ALLT PÅ
    // EN RAD — `\` är radbrytning i bash, inte i Windows cmd, där den ger
    // "Otillåtet alternativ: \" och resten av raden körs som ett eget
    // kommando:
    //   keytool -genkeypair -v -keystore formplan-upload.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload
    //
    // Sätt sedan, t.ex. i %USERPROFILE%\.gradle\gradle.properties:
    //   formplan.keystore=C:/sokvag/till/formplan-upload.jks
    //   formplan.keystorePassword=...
    //   formplan.keyAlias=upload
    //   formplan.keyPassword=...
    //
    // Saknas uppgifterna byggs release osignerad i stället för att bygget
    // kraschar — så en utvecklare utan nyckel fortfarande kan bygga.
    def keystorePath = System.getenv('FORMPLAN_KEYSTORE') ?: project.findProperty('formplan.keystore')
    def keystorePw = System.getenv('FORMPLAN_KEYSTORE_PASSWORD') ?: project.findProperty('formplan.keystorePassword')
    def keyAliasName = System.getenv('FORMPLAN_KEY_ALIAS') ?: project.findProperty('formplan.keyAlias')
    def keyPw = System.getenv('FORMPLAN_KEY_PASSWORD') ?: project.findProperty('formplan.keyPassword')
    // PKCS12 — keytools standard sedan JDK 9 — kan inte ha ett eget
    // nyckellösenord; det är alltid nyckellagrets. Att kräva båda ifyllda vore
    // att kräva samma uppgift två gånger, och utelämnat gav det en
    // NullPointerException i :app:signReleaseBundle. Samma härledning görs i
    // codemagic.yaml, så lokalt och CI beter sig lika.
    if (!keyPw?.toString()) keyPw = keystorePw

    // ALLA FYRA måste finnas, inte bara filen. Med bara keystorePath satt
    // byggdes en halv signeringskonfiguration, och AGP dog i
    // :app:signReleaseBundle med "java.lang.NullPointerException (no error
    // message)" — efter två och en halv minuts bygge, utan att nämna vilket
    // fält som fattades. Hellre ett osignerat bygge med en läsbar varning.
    def missingSigning = [
        'keystore-filen': keystorePath,
        'keystore-lösenordet': keystorePw,
        'nyckelns alias': keyAliasName,
        'nyckelns lösenord': keyPw,
    ].findAll { !it.value?.toString() }.keySet()

    def hasSigningKey = missingSigning.isEmpty() && file(keystorePath).exists()

    signingConfigs {
        release {
            if (hasSigningKey) {
                storeFile file(keystorePath)
                storePassword keystorePw
                keyAlias keyAliasName
                keyPassword keyPw
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigningKey) {
                signingConfig signingConfigs.release
            } else {
                def why = missingSigning.isEmpty()
                    ? "keystore-filen hittades inte: ${keystorePath}"
                    : "saknas: ${missingSigning.join(', ')}"
                logger.warn("FormPlan: signeringen är ofullständig (${why}) — release byggs OSIGNERAD och kan inte laddas upp till Google Play. Se kommentaren i app/build.gradle.")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
