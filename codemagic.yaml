# Codemagic CI/CD — bygger FormPlans iOS-app i molnet (ingen Mac krävs).
#
# Förkrav som konfigureras i Codemagic-UI:t (inte här i filen):
#   1. Apple Developer Program + appen skapad i App Store Connect (bundle-id
#      app.formplan.app).
#   2. Integrations → App Store Connect: koppla en App Store Connect API-nyckel.
#      Använd samma "integration name" nedan (här: "FormPlan ASC").
#   3. Environment variables → grupp "formplan_ios" med webb-byggets värden:
#        VITE_API_URL           = https://api.formplan.app
#        VITE_SUPABASE_URL      = https://rgnbcmgvzohqkmnuixps.supabase.co
#        VITE_SUPABASE_ANON_KEY = <anon-nyckeln>
#        CERTIFICATE_PRIVATE_KEY = <RSA-nyckel i PEM-format, se nedan>
#      (markera CERTIFICATE_PRIVATE_KEY som "secure".)
#
#      Certifikatnyckeln genereras EN gång och återanvänds för alltid:
#        ssh-keygen -t rsa -b 2048 -m PEM -f cert_key -q -N ""
#      Klistra in hela innehållet i filen `cert_key` (inklusive BEGIN/END-
#      raderna) som värde. Byts den ut skapas ett nytt distributionscertifikat
#      vid nästa bygge, och Apple har ett tak för hur många som får finnas.
#
# iOS-projektet (apps/web/ios) genereras i CI med `cap add ios` — det behöver
# alltså inte committas och kräver ingen Mac lokalt.
#
# ── ANDROID ──────────────────────────────────────────────────────────────────
# Förkrav i Codemagic-UI:t för android-formplan nedan:
#   1. Code signing → Android keystore: ladda upp din formplan-upload.jks och
#      ge den referensnamnet "formplan_upload" (samma som android_signing
#      nedan). Codemagic exponerar den då som CM_KEYSTORE_PATH m.fl.
#   2. Environment variables → grupp "formplan_android" med SAMMA tre
#      VITE_*-värden som formplan_ios. De används av webb-bygget, inte av
#      Android, men bygget behöver dem för att `npm run build` ska producera
#      en app som pekar på rätt API.
#
# Android-projektet (apps/web/android) ÄR committat, till skillnad från iOS:.
# Därför `cap sync android` och inte `cap add` — och därför måste
# capacitor.build.gradle vara i synk med package.json, annars saknas nya
# plugins tyst i bygget.
#
# FÖRSTA UPPLADDNINGEN TILL GOOGLE PLAY MÅSTE GÖRAS MANUELLT. Googles API
# vägrar ta emot det allra första paketet för ett nytt app-id, så publishing-
# blocket nedan är avstängt till dess. Hämta .aab:n från byggets artifacts och
# ladda upp den i Play Console → Testning → Internt test.

workflows:
  ios-formplan:
    name: FormPlan iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: FormPlan ASC
    environment:
      groups:
        - formplan_ios
      vars:
        BUNDLE_ID: "app.formplan.app"
        XCODE_SCHEME: "App"
      # Capacitor 8:s CLI kräver Node >= 22 — med 20 dog `cap add ios` med
      # "[fatal] The Capacitor CLI requires NodeJS >=22.0.0".
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Installera beroenden (workspace-root)
        script: npm ci
      - name: Bygg webben (prod) + skapa iOS-projektet
        script: |
          set -e
          cd apps/web
          npm run build

          # `cap add ios` får ALDRIG tystas med "|| true". Misslyckas den finns
          # inget Xcode-projekt, och varje följande steg felar på ett sätt som
          # döljer orsaken — första bygget dog på "Info.plist saknas" när det
          # verkliga felet låg här.
          if [ ! -d ios ]; then
            echo "--- skapar iOS-projektet ---"
            npx cap add ios
          else
            echo "--- ios/ finns redan ---"
          fi

          npx cap sync ios

          # cap sync kan skriva ut ett fel och ändå avsluta med 0. Kontrollera
          # resultatet i stället för returkoden.
          if [ ! -f ios/App/App/Info.plist ]; then
            echo "::error:: iOS-projektet saknas efter cap add/sync — se utskriften ovan."
            ls -la ios 2>/dev/null || echo "(ios/ finns inte alls)"
            exit 1
          fi

          # Ikonerna genereras här eftersom projektet skapas här — annars
          # skeppas Capacitors standardikon till App Store. Källbilderna ligger
          # i apps/web/assets/ och delas med Android.
          npx capacitor-assets generate --ios
      # iOS-projektet genereras här i CI, och Capacitors mall registrerar inget
      # eget URL-schema. Utan det vet iOS inte att app.formplan.app:// hör till
      # appen: magisk länk, Google och lösenordsåterställning blir döda knappar
      # i den installerade appen (samma sak som intent-filtret löser på Android).
      # Schemat måste också vara tillåtet i Supabase under
      # Authentication → URL Configuration → Redirect URLs.
      - name: Info.plist — URL-schema, kameratext, exportdeklaration, byggnummer
        script: |
          PLIST=apps/web/ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          set -e

          # 1. Appens eget URL-schema, för inloggningslänkarna.
          #    Idempotent: ta bort en ev. tidigare post innan den skrivs igen.
          $PB -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes array" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLName string $BUNDLE_ID" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $BUNDLE_ID" "$PLIST"

          # 2. Syftestexter för kamera och bildbibliotek. Appen använder kameran
          #    till streckkodsskanning (getUserMedia) och matfoto. iOS KRASCHAR
          #    appen direkt om texten saknas när kameran öppnas, och App Review
          #    avvisar appar utan syftestext. Texterna visas i systemets dialog.
          $PB -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          $PB -c "Add :NSCameraUsageDescription string 'FormPlan använder kameran för att skanna streckkoder på livsmedel och för att ta bilder på måltider.'" "$PLIST"
          $PB -c "Delete :NSPhotoLibraryUsageDescription" "$PLIST" 2>/dev/null || true
          $PB -c "Add :NSPhotoLibraryUsageDescription string 'FormPlan behöver åtkomst till dina bilder när du väljer ett foto på en måltid.'" "$PLIST"

          # 3. Exportdeklaration. Appen använder bara standard-HTTPS, vilket är
          #    undantaget. Utan nyckeln frågar App Store Connect manuellt vid
          #    VARJE uppladdning och bygget fastnar tills någon svarar.
          $PB -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

          # 4. Byggnummer. TestFlight avvisar en uppladdning vars byggnummer
          #    redan använts, och Capacitors mall sätter alltid 1 — andra
          #    uppladdningen hade alltså failat. Codemagics räknare är unik.
          $PB -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"

          $PB -c "Print" "$PLIST"

      # Universal Links: iOS måste veta att app.formplan.app hör till appen,
      # annars öppnas inloggningslänkarna i Safari i stället för i FormPlan.
      # Kräver TVÅ saker som båda måste stämma:
      #   1. Associated Domains påslaget på App ID:t i Apples portal
      #      (Certificates, Identifiers & Profiles → Identifiers → app.formplan.app)
      #   2. entitlementet nedan, som Capacitors mall inte skapar
      # Filen serveras från apps/web/public/.well-known/apple-app-site-association.
      - name: Associated Domains (Universal Links)
        script: |
          set -e
          # Entitlementet kräver att Associated Domains är PÅSLAGET på App ID:t i
          # Apples portal. Är det inte det utfärdas ingen profil som tillåter det,
          # och bygget faller på signeringen — alltså går appen inte att bygga
          # alls. Eftersom det steget kräver Admin/Account Holder, och den rollen
          # inte alltid finns till hands, är entitlementet avstängt som standard.
          #
          # Slå på det genom att sätta miljövariabeln ENABLE_ASSOCIATED_DOMAINS=true
          # i gruppen formplan_ios — EFTER att capability:n är påslagen hos Apple.
          # Utan det byggs appen utan Universal Links och inloggningslänkarna
          # öppnas i Safari i stället för i appen (det egna schemat fungerar dock).
          if [ "${ENABLE_ASSOCIATED_DOMAINS:-false}" != "true" ]; then
            echo "ENABLE_ASSOCIATED_DOMAINS är inte satt — hoppar över entitlementet."
            echo "Universal Links kommer INTE att fungera i det här bygget."
            exit 0
          fi
          APP_DIR=apps/web/ios/App/App
          cat > "$APP_DIR/App.entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.associated-domains</key>
            <array>
              <string>applinks:app.formplan.app</string>
            </array>
          </dict>
          </plist>
          PLIST
          echo "--- entitlements skrivet ---"
          cat "$APP_DIR/App.entitlements"

      # Keychainen måste finnas INNAN certifikaten hämtas — annars har
      # fetch-signing-files ingenstans att lägga dem.
      - name: Initiera keychain
        script: keychain initialize

      # Teamet har redan distributionscertifikat (skapade för andra verktyg),
      # men deras privata nycklar finns inte här — därför felet "Cannot save
      # Signing Certificates without certificate private key". Med en egen
      # certifikatnyckel kan verktyget skapa och återanvända ett certifikat som
      # det faktiskt äger.
      #
      # CERTIFICATE_PRIVATE_KEY sätts som miljövariabel i gruppen formplan_ios
      # (se README-kommentaren överst). Den MÅSTE vara densamma mellan byggen:
      # genereras en ny varje gång skapas ett nytt certifikat per bygge, och
      # Apple har ett tak för hur många distributionscertifikat ett konto får ha.
      - name: Hämta signeringsfiler
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: Lägg till certifikat i keychain
        script: keychain add-certificates
      - name: Applicera provisioning profiles på Xcode-projektet
        script: xcode-project use-profiles
      # Capacitor 8 skapar iOS-projektet med Swift Package Manager i stället för
      # CocoaPods, och då finns bara App.xcodeproj — ingen App.xcworkspace.
      # Hårdkodad --workspace föll därför på "Path does not exist". Välj den som
      # faktiskt genererats, så fungerar bygget oavsett vilket Capacitor väljer.
      - name: Bygg IPA
        script: |
          set -e
          cd apps/web/ios/App
          ls -la
          # Peka bara ut entitlement-filen om steget faktiskt skrev den.
          ENTITLEMENT_ARG=""
          if [ -f "App/App.entitlements" ]; then
            ENTITLEMENT_ARG='--archive-xcargs CODE_SIGN_ENTITLEMENTS=App/App.entitlements'
          fi
          if [ -d "App.xcworkspace" ]; then
            echo "--- bygger från workspace (CocoaPods) ---"
            xcode-project build-ipa --workspace "App.xcworkspace" --scheme "$XCODE_SCHEME" $ENTITLEMENT_ARG
          else
            echo "--- bygger från projekt (SPM) ---"
            xcode-project build-ipa --project "App.xcodeproj" --scheme "$XCODE_SCHEME" $ENTITLEMENT_ARG
          fi
    artifacts:
      - apps/web/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Bygget laddas upp till App Store Connect och blir omedelbart
        # tillgängligt för INTERNA testare — ingen granskning, ingen väntetid.
        #
        # submit_to_testflight skickar bygget till Apples beta-granskning för
        # EXTERNA testare, och den kräver ifylld testinformation (feedback-
        # adress samt namn, telefon och e-post till en kontaktperson). Saknas
        # den failar hela bygget i sista steget trots att appen redan ligger
        # uppe och fungerar.
        #
        # Slå på den när du fyllt i:
        #   App Store Connect → FormPlan → TestFlight → Test Information
        # och lägg till beta_groups med namnet på din externa testgrupp.
        submit_to_testflight: false
        # submit_to_app_store: false  # slå på när du är redo för skarp granskning

  android-formplan:
    name: FormPlan Android
    # Linux räcker för Android och är billigare än en Mac.
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      groups:
        - formplan_android
      android_signing:
        - formplan_upload
      # Samma skäl som på iOS: Capacitor 8:s CLI kräver Node >= 22.
      node: 22
      # AGP 8.x kräver JDK 17 eller senare; 21 är det som Codemagics image har
      # som standard och det Capacitor 8 testas mot.
      java: 21
    scripts:
      - name: Installera beroenden (workspace-root)
        script: npm ci

      - name: Bygg webben (prod) och synka Android-projektet
        script: |
          set -e
          cd apps/web
          npm run build
          npx cap sync android

          # cap sync kan skriva ut ett fel och ändå avsluta med 0 — kontrollera
          # resultatet i stället för returkoden. Samma fälla som på iOS-sidan.
          if [ ! -f android/app/src/main/assets/public/index.html ]; then
            echo "cap sync kopierade inte webbtillgångarna — avbryter."
            exit 1
          fi

          # Plugins måste ha registrerats, annars byggs appen utan dem och
          # notiser/skärmlås slutar fungera UTAN felmeddelande.
          for plugin in capacitor-local-notifications capacitor-community-keep-awake; do
            if ! grep -q "$plugin" android/app/capacitor.build.gradle; then
              echo "$plugin saknas i capacitor.build.gradle — avbryter."
              exit 1
            fi
          done

      - name: Signeringsnyckel från Codemagic till Gradle
        script: |
          set -e
          # app/build.gradle läser FORMPLAN_*; Codemagics keystore-integration
          # sätter CM_*. Mappa i stället för att ändra build.gradle, så ett
          # lokalt bygge med gradle.properties fortsätter fungera.
          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "Ingen keystore kopplad i Codemagic — .aab:n blir OSIGNERAD"
            echo "och går inte att ladda upp till Google Play."
            echo "Ladda upp nyckeln under Code signing → Android keystore."
            exit 1
          fi
          cat >> "$CM_ENV" <<EOF
          FORMPLAN_KEYSTORE=$CM_KEYSTORE_PATH
          FORMPLAN_KEYSTORE_PASSWORD=$CM_KEYSTORE_PASSWORD
          FORMPLAN_KEY_ALIAS=$CM_KEY_ALIAS
          FORMPLAN_KEY_PASSWORD=$CM_KEY_PASSWORD
          FORMPLAN_VERSION_CODE=$BUILD_NUMBER
          EOF

      - name: Bygg signerad AAB
        script: |
          set -e
          cd apps/web/android
          chmod +x ./gradlew
          ./gradlew bundleRelease

          # Gradle varnar bara i loggen när nyckeln saknas och producerar ett
          # osignerat paket. Play avvisar det med ett svårläst fel timmar
          # senare — fånga det här i stället.
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          if [ -z "$AAB" ]; then
            echo "Ingen .aab producerad."
            exit 1
          fi
          if unzip -l "$AAB" | grep -q 'META-INF/.*\.RSA\|META-INF/.*\.EC'; then
            echo "✓ signerad: $AAB"
          else
            echo "✗ $AAB verkar OSIGNERAD — Google Play kommer avvisa den."
            exit 1
          fi
    artifacts:
      - apps/web/android/app/build/outputs/bundle/**/*.aab
      - apps/web/android/app/build/outputs/**/mapping.txt
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: false
    #
    # Slå på blocket ovan EFTER att du laddat upp den första .aab:n manuellt.
    # Googles Publishing API vägrar ta emot det första paketet för ett nytt
    # app-id, så ett automatiskt bygge hade failat i sista steget trots att
    # allt annat gick bra. Du behöver då också:
    #   1. Ett tjänstekonto i Google Cloud med Play-behörighet, och dess
    #      JSON-nyckel i Environment variables som
    #      GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (markerad "secure").
    #   2. Play Console → Användare och behörigheter → bjud in tjänstekontot
    #      med rätten att hantera releaser.
